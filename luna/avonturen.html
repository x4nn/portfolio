<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Kies je eigen avontuur, speciaal voor Luna.">
    <title>Kies je avontuur — Luna 🌙</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/avonturen.css">
</head>
<body>
<div class="adventures-wrap" id="adventures-wrap">

    <a href="/luna" class="home-link">← terug naar huis</a>

    <header class="adventures-header">
        <h1 class="adventures-title">Kies je avontuur</h1>
        <p class="adventures-subtitle">Drie kleine verhaaltjes, helemaal aan jou om te ontdekken. Elk verhaal heeft meerdere eindes 🌙</p>
    </header>

    <section class="adventures-picker" id="adventures-picker">
        <div id="story-cards-list"></div>
    </section>

    <section class="adventures-reader" id="adventures-reader">
        <button type="button" class="reader-back-button" id="reader-back-button">← kies een ander verhaal</button>
        <div class="reader-card">
            <div class="reader-story-title" id="reader-story-title"></div>
            <p class="reader-scene-text" id="reader-scene-text"></p>
            <div class="reader-choices" id="reader-choices"></div>
            <div id="reader-ending-area"></div>
        </div>
    </section>

</div>

<div class="resume-modal-overlay" id="resume-modal-overlay">
    <div class="resume-modal" role="dialog" aria-modal="true" aria-labelledby="resume-modal-title">
        <div class="resume-modal-title" id="resume-modal-title">Verder waar je was?</div>
        <p class="resume-modal-text">Je was al bezig met dit verhaal. Wil je verdergaan, of opnieuw beginnen?</p>
        <div class="resume-modal-actions">
            <button type="button" class="btn btn--primary" id="resume-continue-button">Verder waar je was</button>
            <button type="button" class="btn btn--soft" id="resume-restart-button">Opnieuw beginnen</button>
        </div>
    </div>
</div>

<script src="js/avonturen.js"></script>
</body>
</html>
