<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Luna's eigen dagboekplekje.">
    <title>Dagboek — Luna 🌿</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dagboek.css">
</head>
<body>
<div class="diary-wrap" id="diary-wrap">

    <a href="/luna" class="home-link">← terug naar huis</a>

    <header class="diary-header">
        <h1 class="diary-title">Dagboek</h1>
        <p class="diary-subtitle">Schrijf hier over je dag, zo lang of zo kort als je wilt.</p>
    </header>

    <section class="diary-card">
        <div class="diary-date" id="diary-today-date"></div>

        <div class="diary-prompt-row">
            <p class="diary-prompt-text" id="diary-prompt-text"></p>
            <button type="button" class="diary-prompt-button" id="diary-another-prompt-button">ander prompt</button>
        </div>

        <div class="diary-mood-row" id="diary-mood-row" role="group" aria-label="Kies je stemming"></div>

        <label for="diary-textarea" class="visually-hidden" style="position:absolute; left:-9999px;">Jouw dagboektekst</label>
        <textarea class="diary-textarea" id="diary-textarea" placeholder="Vertel eens hoe je dag was…"></textarea>

        <div class="diary-actions">
            <span class="diary-save-status" id="diary-save-status"></span>
            <button type="button" class="btn btn--primary" id="diary-save-button">Opslaan</button>
        </div>
    </section>

    <section>
        <h2 class="diary-entries-heading">Eerdere dagen</h2>
        <div id="diary-entries-list"></div>
    </section>

    <div class="diary-download-row">
        <button type="button" class="btn btn--soft" id="diary-download-button">⬇ Download al mijn dagboekjes</button>
    </div>

    <!-- ✏️ EDIT: jouw eigen berichtje hieronder aanpassen. -->
    <p class="diary-note">Dit is jouw plekje om over je dag te vertellen — en ik lees het heel graag, zo weet ik hoe je dag was, ook al ben ik er niet bij. 💚<br>— xan</p>

</div>

<script src="js/dagboek.js"></script>
</body>
</html>
